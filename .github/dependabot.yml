version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      grafana:
        patterns:
          - "@grafana/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Base tsconfig of the create-plugin template, must match .config/tsconfig.json: even
      # 2.0.1 -> 2.2.0 broke the build (moduleResolution "bundler" vs ts-node "commonjs").
      # Updated only together with the template, all versions ignored here.
      - dependency-name: "@grafana/tsconfig"
      # React 19 is not supported by the Grafana 12.x plugin runtime
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # Build/test tooling from the @grafana/create-plugin template (.config/). Major versions
      # are bumped together with the template by `npx @grafana/create-plugin update`
      # (cp-update.yml), separate major bumps break the template config.
      - dependency-name: "@grafana/eslint-config"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@grafana/plugin-e2e"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stylistic/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@swc/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "copy-webpack-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "css-loader"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fork-ts-checker-webpack-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "glob"
        update-types: ["version-update:semver-major"]
      - dependency-name: "identity-obj-proxy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "imports-loader"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "replace-in-file-webpack-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sass"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sass-loader"
        update-types: ["version-update:semver-major"]
      - dependency-name: "semver"
        update-types: ["version-update:semver-major"]
      - dependency-name: "style-loader"
        update-types: ["version-update:semver-major"]
      - dependency-name: "swc-loader"
        update-types: ["version-update:semver-major"]
      - dependency-name: "terser-webpack-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ts-node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
