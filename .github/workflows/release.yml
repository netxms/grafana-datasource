# On a version tag: builds, signs, packages and validates the plugin (build-plugin.yml),
# then creates a DRAFT GitHub release with the zip + sha1. If validation fails, no release
# is created and GitHub emails the person who pushed the tag.
# Publishing to the Grafana plugin catalog is a manual step afterwards (see CLAUDE.md).
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      sign: true
    secrets:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Extract release notes from CHANGELOG.md
        run: awk '/^## / {s++} s == 1 {print}' CHANGELOG.md > release_notes.md

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release_notes.md
          files: |
            ${{ needs.build.outputs.archive }}
            ${{ needs.build.outputs.archive-sha1sum }}
